<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taylor Swift: The Eras Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="bio-section">
        <h1 class="animate-text">TAYLOR SWIFT</h1>
        <p class="bio-text">从乡村音乐新星到全球流行巨星，她用歌词记录时代，用音乐重塑世界。欢迎来到她的音乐视界。</p>
        
        <div class="timeline">
            <div class="timeline-item"><span>2006</span> 乡村起步，首张同名专辑惊艳亮相</div>
            <div class="timeline-item"><span>2014</span> 《1989》彻底转型全球流行天后</div>
            <div class="timeline-item"><span>2020</span> 《Folklore》民谣回归，斩获格莱美年度专辑</div>
            <div class="timeline-item"><span>2023-2026</span> Eras Tour 时代巡演，刷新历史音乐记录</div>
        </div>
    </section>

    <section class="album-section">
        <h2>选择一个时代 (Select an Era)</h2>
        <div class="album-grid">
            <div class="album-card" data-era="fearless">
                <div class="album-cover" style="background: #e5c158;">📀</div>
                <h3>Fearless</h3>
            </div>
            <div class="album-card" data-era="1989">
                <div class="album-cover" style="background: #bce3f2;">🩵</div>
                <h3>1989</h3>
            </div>
            <div class="album-card" data-era="reputation">
                <div class="album-cover" style="background: #111111; color: #fff;">🐍</div>
                <h3>Reputation</h3>
            </div>
            <div class="album-card" data-era="lover">
                <div class="album-cover" style="background: linear-gradient(135deg, #fbc5d8, #bce3f2);">💖</div>
                <h3>Lover</h3>
            </div>
            <div class="album-card" data-era="folklore">
                <div class="album-cover" style="background: #848a80;">🌲</div>
                <h3>Folklore</h3>
            </div>
            <div class="album-card" data-era="midnights">
                <div class="album-cover" style="background: #0f172a; color: #fff;">🌌</div>
                <h3>Midnights</h3>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
